<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>长篇小说写作助手</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #20232b;
            --muted: #6b7280;
            --paper: #fffdf8;
            --panel: #ffffff;
            --line: #e7e1d7;
            --brand: #74523a;
            --brand-dark: #543927;
            --accent: #b7794b;
            --soft: #f5efe6;
            --danger: #a33a32;
            --success: #2f6a4f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: #eee9e1;
            font-family: "Noto Serif SC", "Songti SC", "Microsoft YaHei", serif;
        }

        button, input, textarea, select { font: inherit; }
        button { cursor: pointer; }

        .shell {
            display: grid;
            grid-template-columns: 260px minmax(320px, 470px) minmax(460px, 1fr);
            min-height: 100vh;
        }

        .sidebar, .editor, .manuscript {
            min-width: 0;
            padding: 24px;
        }

        .sidebar {
            color: #f9f5ef;
            background: #2f2925;
        }

        .brand {
            margin-bottom: 28px;
        }

        .brand h1 {
            margin: 0 0 8px;
            font-size: 22px;
            letter-spacing: .08em;
        }

        .brand p {
            margin: 0;
            color: #cfc6bd;
            font-size: 13px;
            line-height: 1.6;
        }

        .sidebar-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 22px 0 10px;
            font-size: 13px;
            color: #d8cec4;
        }

        .project-list {
            display: grid;
            gap: 8px;
        }

        .project-item {
            width: 100%;
            padding: 11px 12px;
            text-align: left;
            color: #eee8e2;
            background: transparent;
            border: 1px solid #514740;
            border-radius: 8px;
        }

        .project-item:hover,
        .project-item.active {
            background: #493e37;
            border-color: #8e735f;
        }

        .project-item span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .project-item small {
            display: block;
            margin-top: 4px;
            color: #b9aea5;
            font-size: 11px;
        }

        .sidebar button.secondary {
            color: #f5eee8;
            border-color: #6b5b50;
            background: transparent;
        }

        .editor {
            overflow-y: auto;
            background: var(--paper);
            border-right: 1px solid var(--line);
        }

        .manuscript {
            overflow-y: auto;
            background: #f7f3ec;
        }

        h2 {
            margin: 0 0 18px;
            font-size: 20px;
        }

        .field { margin-bottom: 17px; }

        label {
            display: block;
            margin-bottom: 7px;
            color: #514940;
            font-size: 13px;
            font-weight: 700;
        }

        input, textarea, select {
            width: 100%;
            border: 1px solid #d8d0c6;
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            padding: 11px 12px;
        }

        textarea {
            min-height: 112px;
            line-height: 1.65;
            resize: vertical;
        }

        #text-input { min-height: 280px; }

        input:focus, textarea:focus, select:focus {
            outline: 2px solid #d9b89d;
            border-color: var(--accent);
        }

        .inline {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .hint {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        .file-box {
            display: block;
            padding: 14px;
            border: 1px dashed #bea995;
            border-radius: 8px;
            color: #6d5745;
            background: var(--soft);
            text-align: center;
            cursor: pointer;
        }

        #file-input { display: none; }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 18px;
        }

        button {
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 10px 15px;
            color: white;
            background: var(--brand);
        }

        button:hover { background: var(--brand-dark); }
        button:disabled { cursor: not-allowed; opacity: .5; }

        button.secondary {
            color: var(--brand);
            border-color: #c8b7a7;
            background: #fff;
        }

        button.secondary:hover { background: var(--soft); }

        button.danger {
            color: var(--danger);
            border-color: #d9aaa6;
            background: transparent;
        }

        .status {
            display: none;
            margin-bottom: 14px;
            padding: 11px 13px;
            color: #60492f;
            border-left: 4px solid var(--accent);
            background: #f0e4d5;
            border-radius: 6px;
            font-size: 13px;
        }

        .status.error {
            display: block;
            color: #7a2722;
            border-color: var(--danger);
            background: #f7e2e0;
        }

        .status.visible { display: block; }

        .empty {
            margin-top: 80px;
            color: var(--muted);
            text-align: center;
            line-height: 1.8;
        }

        .chapter {
            max-width: 840px;
            margin: 0 auto 18px;
            padding: 28px 32px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
            box-shadow: 0 5px 20px rgba(77, 60, 44, .05);
        }

        .chapter-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            color: var(--muted);
            font-size: 12px;
        }

        .chapter-content {
            white-space: pre-wrap;
            line-height: 1.95;
            font-size: 16px;
        }

        .review {
            margin-top: 20px;
            padding: 12px;
            color: #5f4a31;
            white-space: pre-wrap;
            border-radius: 6px;
            background: #f7f0e5;
            font-size: 12px;
            line-height: 1.6;
        }

        .versions {
            max-width: 840px;
            margin: 26px auto;
            padding-top: 18px;
            border-top: 1px solid #d8d0c6;
        }

        .versions summary {
            color: var(--brand);
            cursor: pointer;
            font-weight: 700;
        }

        .version-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            background: #fff;
            font-size: 12px;
        }

        .version-row .excerpt {
            flex: 1;
            overflow: hidden;
            color: var(--muted);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .version-row button {
            padding: 6px 10px;
            font-size: 11px;
        }

        @media (max-width: 1100px) {
            .shell { grid-template-columns: 220px 390px 1fr; }
        }

        @media (max-width: 820px) {
            .shell { display: block; }
            .sidebar, .editor, .manuscript { min-height: auto; }
            .project-list { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
            .manuscript { min-height: 60vh; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <aside class="sidebar">
            <div class="brand">
                <h1>长篇小说写作助手</h1>
                <p>分层记忆、版本管理与一致性检查，让多轮续写保持人物、情节和世界观连贯。</p>
            </div>
            <button class="secondary" type="button" onclick="newProject()">＋ 新建小说</button>
            <div class="sidebar-title">
                <span>我的项目</span>
                <span id="project-count">0</span>
            </div>
            <div id="project-list" class="project-list"></div>
        </aside>

        <section class="editor">
            <h2 id="editor-title">新建小说项目</h2>
            <form id="novel-form">
                <div class="field">
                    <label for="title">小说名称</label>
                    <input id="title" name="title" maxlength="80" placeholder="未填写时自动使用原文首行">
                </div>

                <div class="field">
                    <label for="text-input">原文</label>
                    <textarea id="text-input" name="text_input" placeholder="粘贴已有小说内容。长文本会分块建立人物、世界观、时间线和伏笔记忆。"></textarea>
                </div>

                <div class="field">
                    <input id="file-input" type="file" name="file" accept=".txt,.md">
                    <label class="file-box" for="file-input" id="file-label">选择 TXT / Markdown 文件</label>
                </div>

                <div class="field">
                    <label for="requirements">长期写作要求</label>
                    <textarea id="requirements" name="requirements" placeholder="例如：保持第三人称限知视角；减少华丽比喻；本章推进主角调查。"></textarea>
                </div>

                <div class="inline">
                    <div class="field">
                        <label for="word-limit">目标字数</label>
                        <input id="word-limit" name="word_limit" type="number" value="1000" min="100" max="10000">
                    </div>
                    <div class="field">
                        <label for="writing-mode">写作模式</label>
                        <select id="writing-mode" name="writing_mode">
                            <option value="standard">标准：规划并检查</option>
                            <option value="quick">快速：直接续写</option>
                        </select>
                    </div>
                </div>
                <small class="hint">
                    超过 {{ "{:,}".format(text_length_threshold) }} 字符时自动分块总结。标准模式会先规划情节，并在生成后给出一致性检查结果。
                </small>

                <div class="actions">
                    <button id="start-btn" type="submit">开始续写</button>
                    <button id="continue-btn" type="button" class="secondary" onclick="continueWriting()" hidden>继续续写</button>
                    <button id="restart-btn" type="button" class="secondary" onclick="restartWriting()" hidden>重写最后一段</button>
                    <button id="export-btn" type="button" class="secondary" onclick="exportProject()" hidden>导出 Markdown</button>
                    <button id="delete-btn" type="button" class="danger" onclick="deleteProject()" hidden>删除项目</button>
                </div>
            </form>
        </section>

        <section class="manuscript">
            <div id="status" class="status"></div>
            <div id="output" class="empty">
                新建小说项目，或从左侧打开已有项目。<br>
                每次重写都会保留旧版本，可随时恢复。
            </div>
            <details id="versions" class="versions" hidden>
                <summary>查看生成版本历史</summary>
                <div id="version-list"></div>
            </details>
        </section>
    </main>

    <script>
        let currentProjectId = null;
        let currentProject = null;
        let eventSource = null;
        let liveChapter = null;
        let streamCompleted = false;

        const $ = id => document.getElementById(id);

        function setBusy(busy) {
            ["start-btn", "continue-btn", "restart-btn", "delete-btn"].forEach(id => {
                $(id).disabled = busy;
            });
        }

        function showStatus(message, error = false) {
            const element = $("status");
            element.textContent = message;
            element.className = `status visible${error ? " error" : ""}`;
        }

        function hideStatus() {
            $("status").className = "status";
        }

        function closeStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        }

        async function api(url, options = {}) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
                throw new Error(body.error || `请求失败（${response.status}）`);
            }
            return body;
        }

        async function loadProjects() {
            const body = await api("/api/projects");
            $("project-count").textContent = body.projects.length;
            const list = $("project-list");
            list.replaceChildren();
            body.projects.forEach(project => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = `project-item${project.id === currentProjectId ? " active" : ""}`;
                const title = document.createElement("span");
                title.textContent = project.title;
                const updated = document.createElement("small");
                updated.textContent = new Date(project.updated_at).toLocaleString();
                button.append(title, updated);
                button.onclick = () => loadProject(project.id);
                list.appendChild(button);
            });
        }

        async function loadProject(projectId) {
            closeStream();
            const body = await api(`/api/projects/${projectId}`);
            currentProjectId = projectId;
            currentProject = body.project;
            $("editor-title").textContent = body.project.title;
            $("title").value = body.project.title;
            $("text-input").value = body.project.original_text;
            $("text-input").disabled = true;
            $("file-input").disabled = true;
            $("requirements").value = body.project.requirements;
            $("word-limit").value = body.project.word_limit;
            $("writing-mode").value = body.project.writing_mode;
            $("start-btn").hidden = true;
            ["continue-btn", "restart-btn", "export-btn", "delete-btn"].forEach(id => {
                $(id).hidden = false;
            });
            renderProject(body.project);
            hideStatus();
            await loadProjects();
        }

        function renderProject(project) {
            const output = $("output");
            output.className = "";
            output.replaceChildren();
            if (!project.active_generations.length) {
                output.className = "empty";
                output.textContent = "项目已创建，正在等待第一次续写。";
            }
            project.active_generations.forEach(generation => {
                output.appendChild(chapterElement(generation));
            });

            const versions = project.generation_history;
            $("versions").hidden = versions.length === 0;
            const list = $("version-list");
            list.replaceChildren();
            versions.forEach(version => {
                const row = document.createElement("div");
                row.className = "version-row";
                const label = document.createElement("strong");
                label.textContent = `第 ${version.position} 段 · 版本 ${version.version}`;
                const excerpt = document.createElement("span");
                excerpt.className = "excerpt";
                excerpt.textContent = version.content.replace(/\s+/g, " ").slice(0, 90);
                const restore = document.createElement("button");
                restore.type = "button";
                restore.className = "secondary";
                restore.textContent = version.is_active ? "当前版本" : "恢复";
                restore.disabled = Boolean(version.is_active);
                restore.onclick = () => restoreVersion(version.id);
                row.append(label, excerpt, restore);
                list.appendChild(row);
            });
        }

        function chapterElement(generation) {
            const article = document.createElement("article");
            article.className = "chapter";
            const head = document.createElement("div");
            head.className = "chapter-head";
            head.textContent = `续写第 ${generation.position} 段 · 版本 ${generation.version}`;
            const content = document.createElement("div");
            content.className = "chapter-content";
            content.textContent = generation.content;
            article.append(head, content);
            if (generation.consistency_report) {
                const review = document.createElement("div");
                review.className = "review";
                review.textContent = `一致性检查\n${generation.consistency_report}`;
                article.appendChild(review);
            }
            return article;
        }

        function newProject() {
            closeStream();
            currentProjectId = null;
            currentProject = null;
            $("novel-form").reset();
            $("word-limit").value = "1000";
            $("writing-mode").value = "standard";
            $("text-input").disabled = false;
            $("file-input").disabled = false;
            $("editor-title").textContent = "新建小说项目";
            $("file-label").textContent = "选择 TXT / Markdown 文件";
            $("start-btn").hidden = false;
            ["continue-btn", "restart-btn", "export-btn", "delete-btn"].forEach(id => {
                $(id).hidden = true;
            });
            $("output").className = "empty";
            $("output").textContent = "填写原文和创作要求后开始续写。";
            $("versions").hidden = true;
            hideStatus();
            loadProjects().catch(error => showStatus(error.message, true));
        }

        function settingsQuery() {
            const params = new URLSearchParams({
                word_limit: $("word-limit").value,
                requirements: $("requirements").value,
                writing_mode: $("writing-mode").value
            });
            return params.toString();
        }

        function startStreaming(url, replaceLast = false) {
            closeStream();
            setBusy(true);
            streamCompleted = false;
            liveChapter = document.createElement("article");
            liveChapter.className = "chapter";
            const head = document.createElement("div");
            head.className = "chapter-head";
            head.textContent = replaceLast ? "正在生成新的替代版本…" : "正在生成…";
            const content = document.createElement("div");
            content.className = "chapter-content";
            liveChapter.append(head, content);
            $("output").className = "";
            $("output").appendChild(liveChapter);
            liveChapter.scrollIntoView({behavior: "smooth", block: "start"});

            eventSource = new EventSource(url);
            eventSource.onmessage = async event => {
                const data = JSON.parse(event.data);
                if (data.type === "status") {
                    showStatus(data.content);
                } else if (data.type === "content") {
                    content.textContent += data.content;
                } else if (data.type === "review") {
                    const review = document.createElement("div");
                    review.className = "review";
                    review.textContent = `一致性检查\n${data.content}`;
                    liveChapter.appendChild(review);
                } else if (data.type === "complete") {
                    streamCompleted = true;
                    closeStream();
                    setBusy(false);
                    hideStatus();
                    await loadProject(currentProjectId);
                } else if (data.type === "error") {
                    closeStream();
                    setBusy(false);
                    liveChapter.remove();
                    showStatus(data.content, true);
                }
            };
            eventSource.onerror = () => {
                if (streamCompleted) return;
                closeStream();
                setBusy(false);
                showStatus("流式连接中断。已成功保存的版本不会丢失，请重新打开项目确认。", true);
            };
        }

        $("novel-form").addEventListener("submit", async event => {
            event.preventDefault();
            setBusy(true);
            hideStatus();
            try {
                const body = await api("/process", {
                    method: "POST",
                    body: new FormData(event.currentTarget)
                });
                currentProjectId = body.project_id;
                await loadProjects();
                $("output").replaceChildren();
                startStreaming(`/stream/${currentProjectId}`);
            } catch (error) {
                setBusy(false);
                showStatus(error.message, true);
            }
        });

        function continueWriting() {
            if (!currentProjectId) return;
            startStreaming(`/continue/${currentProjectId}?${settingsQuery()}`);
        }

        function restartWriting() {
            if (!currentProjectId) return;
            startStreaming(`/restart/${currentProjectId}?${settingsQuery()}`, true);
        }

        async function restoreVersion(generationId) {
            try {
                await api(`/api/projects/${currentProjectId}/restore/${generationId}`, {
                    method: "POST"
                });
                await loadProject(currentProjectId);
            } catch (error) {
                showStatus(error.message, true);
            }
        }

        async function deleteProject() {
            if (!currentProjectId || !confirm("确定删除该小说项目及全部版本吗？")) return;
            try {
                await api(`/api/projects/${currentProjectId}`, {method: "DELETE"});
                newProject();
            } catch (error) {
                showStatus(error.message, true);
            }
        }

        function exportProject() {
            if (!currentProject) return;
            const generated = currentProject.active_generations
                .map((item, index) => `## 续写 ${index + 1}\n\n${item.content}`)
                .join("\n\n");
            const content = `# ${currentProject.title}\n\n## 原文\n\n${currentProject.original_text}\n\n${generated}\n`;
            const blob = new Blob([content], {type: "text/markdown;charset=utf-8"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${currentProject.title.replace(/[\\/:*?"<>|]/g, "_")}.md`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        $("file-input").addEventListener("change", event => {
            const file = event.target.files[0];
            $("file-label").textContent = file ? `已选择：${file.name}` : "选择 TXT / Markdown 文件";
        });

        window.addEventListener("beforeunload", closeStream);
        loadProjects().catch(error => showStatus(error.message, true));
    </script>
</body>
</html>
