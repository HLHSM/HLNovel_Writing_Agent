<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>长篇小说写作助手</title>
    <style>
        :root {
            --bg: #ffffff;
            --sidebar: #f9f9f9;
            --surface: #ffffff;
            --surface-secondary: #f7f7f8;
            --surface-hover: #ececec;
            --text: #0d0d0d;
            --text-secondary: #676767;
            --border: #e5e5e5;
            --button: #0d0d0d;
            --button-text: #ffffff;
            --danger: #c83232;
            --success: #16845b;
            --shadow: 0 0 0 1px rgba(0, 0, 0, .05), 0 4px 18px rgba(0, 0, 0, .08);
            --sidebar-width: 260px;
        }

        html[data-theme="dark"] {
            --bg: #212121;
            --sidebar: #171717;
            --surface: #2f2f2f;
            --surface-secondary: #2a2a2a;
            --surface-hover: #2f2f2f;
            --text: #ececec;
            --text-secondary: #b4b4b4;
            --border: #3d3d3d;
            --button: #ececec;
            --button-text: #171717;
            --danger: #ff8585;
            --success: #63d5aa;
            --shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 6px 22px rgba(0, 0, 0, .24);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            color: var(--text);
            background: var(--bg);
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            font-size: 14px;
        }

        button,
        input,
        textarea,
        select {
            color: inherit;
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible,
        summary:focus-visible {
            outline: 2px solid #5b9df9;
            outline-offset: 2px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .45;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            display: flex;
            flex: 0 0 var(--sidebar-width);
            flex-direction: column;
            width: var(--sidebar-width);
            height: 100%;
            padding: 10px;
            background: var(--sidebar);
            transition: transform .2s ease;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            padding: 6px 8px 12px;
        }

        .brand-mark,
        .assistant-avatar {
            display: grid;
            flex: 0 0 auto;
            place-items: center;
            width: 28px;
            height: 28px;
            color: var(--button-text);
            background: var(--button);
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
        }

        .brand-name {
            overflow: hidden;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-button {
            display: inline-grid;
            flex: 0 0 auto;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            color: var(--text);
            background: transparent;
            border-radius: 9px;
        }

        .icon-button:hover,
        .sidebar-action:hover,
        .project-item:hover {
            background: var(--surface-hover);
        }

        .mobile-only {
            display: none;
        }

        .sidebar-action {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 42px;
            padding: 9px 10px;
            color: var(--text);
            background: transparent;
            border-radius: 9px;
            text-align: left;
        }

        .sidebar-section-title {
            padding: 22px 10px 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
        }

        .project-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .project-item {
            display: block;
            width: 100%;
            margin-bottom: 2px;
            padding: 10px;
            overflow: hidden;
            color: var(--text);
            background: transparent;
            border-radius: 9px;
            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .project-item.active {
            background: var(--surface-hover);
            font-weight: 600;
        }

        .sidebar-footer {
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .workspace {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-width: 0;
            height: 100%;
            background: var(--bg);
        }

        .topbar {
            display: flex;
            z-index: 10;
            align-items: center;
            justify-content: space-between;
            min-height: 56px;
            padding: 8px 16px;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            border-bottom: 1px solid transparent;
            backdrop-filter: blur(12px);
        }

        .topbar-title {
            flex: 1;
            min-width: 0;
            margin: 0 10px;
            overflow: hidden;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .text-button {
            min-height: 36px;
            padding: 7px 12px;
            color: var(--text);
            background: transparent;
            border-radius: 9px;
            font-size: 13px;
        }

        .text-button:hover {
            background: var(--surface-hover);
        }

        .text-button.danger {
            color: var(--danger);
        }

        .conversation {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .welcome-view {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            padding: 48px 24px 80px;
        }

        .welcome-card {
            width: min(720px, 100%);
        }

        .welcome-heading {
            margin-bottom: 28px;
            text-align: center;
        }

        .welcome-icon {
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            margin: 0 auto 18px;
            color: var(--button-text);
            background: var(--button);
            border-radius: 50%;
            font-size: 20px;
        }

        .welcome-heading h1 {
            margin: 0 0 10px;
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 600;
            letter-spacing: -.03em;
        }

        .welcome-heading p {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.65;
        }

        .new-project-form {
            padding: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }

        .field {
            margin-bottom: 16px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field-label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .control {
            width: 100%;
            padding: 11px 12px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        textarea.control {
            min-height: 180px;
            line-height: 1.65;
            resize: vertical;
        }

        .control:focus {
            border-color: #8b8b8b;
            outline: none;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        .file-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 36px;
            padding: 7px 11px;
            color: var(--text);
            background: var(--surface-secondary);
            border-radius: 9px;
            cursor: pointer;
        }

        .file-label:hover {
            background: var(--surface-hover);
        }

        .file-name {
            flex: 1;
            overflow: hidden;
            color: var(--text-secondary);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .advanced-settings {
            margin-top: 4px;
            border-top: 1px solid var(--border);
        }

        .advanced-settings summary {
            padding: 14px 0 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-top: 10px;
        }

        .primary-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            padding: 9px 16px;
            color: var(--button-text);
            background: var(--button);
            border-radius: 10px;
            font-weight: 600;
        }

        .primary-button:hover {
            opacity: .88;
        }

        .submit-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 18px;
        }

        .submit-hint {
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.5;
        }

        .thread-view {
            width: min(820px, 100%);
            margin: 0 auto;
            padding: 22px 24px 160px;
        }

        .thread-empty {
            padding: 100px 20px;
            color: var(--text-secondary);
            text-align: center;
        }

        .message {
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr);
            gap: 14px;
            padding: 22px 0 28px;
        }

        .assistant-avatar {
            width: 30px;
            height: 30px;
            font-size: 12px;
        }

        .message-main {
            min-width: 0;
        }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 30px;
            margin-bottom: 8px;
        }

        .message-author {
            font-weight: 600;
        }

        .version-badge {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 400;
        }

        .message-content {
            color: var(--text);
            font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
            font-size: 16px;
            line-height: 1.95;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message-tools {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
            opacity: 0;
            transition: opacity .15s ease;
        }

        .message:hover .message-tools,
        .message:focus-within .message-tools {
            opacity: 1;
        }

        .tool-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 32px;
            padding: 6px 9px;
            color: var(--text-secondary);
            background: transparent;
            border-radius: 8px;
            font-size: 12px;
        }

        .tool-button:hover {
            color: var(--text);
            background: var(--surface-hover);
        }

        .analysis-details {
            margin-top: 14px;
            color: var(--text-secondary);
            background: var(--surface-secondary);
            border-radius: 10px;
            font-size: 13px;
        }

        .analysis-details summary {
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .analysis-body {
            padding: 0 12px 12px;
            line-height: 1.65;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .typing-cursor::after {
            display: inline-block;
            width: 7px;
            height: 17px;
            margin-left: 3px;
            vertical-align: -2px;
            background: var(--text);
            animation: blink .8s steps(1) infinite;
            content: "";
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .version-history {
            margin: 18px 0 30px 44px;
            border-top: 1px solid var(--border);
        }

        .version-history > summary {
            padding: 16px 0;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .version-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            font-size: 12px;
        }

        .version-excerpt {
            overflow: hidden;
            color: var(--text-secondary);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .composer-area {
            z-index: 8;
            flex: 0 0 auto;
            padding: 0 24px 14px;
            background: linear-gradient(to top, var(--bg) 74%, transparent);
        }

        .composer {
            width: min(780px, 100%);
            margin: 0 auto;
            padding: 10px 12px 9px;
            background: var(--surface);
            border-radius: 26px;
            box-shadow: var(--shadow);
        }

        .composer textarea {
            display: block;
            width: 100%;
            min-height: 46px;
            max-height: 180px;
            padding: 9px 9px 5px;
            color: var(--text);
            background: transparent;
            border: 0;
            line-height: 1.5;
            resize: none;
        }

        .composer textarea:focus {
            outline: 0;
        }

        .composer-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .composer-options {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
        }

        .compact-select,
        .compact-input {
            height: 34px;
            padding: 5px 8px;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 12px;
        }

        .compact-input {
            width: 78px;
        }

        .send-button {
            display: grid;
            flex: 0 0 auto;
            place-items: center;
            width: 34px;
            height: 34px;
            padding: 0;
            color: var(--button-text);
            background: var(--button);
            border-radius: 50%;
        }

        .composer-note {
            margin: 7px auto 0;
            color: var(--text-secondary);
            font-size: 11px;
            text-align: center;
        }

        .toast {
            position: fixed;
            z-index: 50;
            top: 68px;
            left: calc(var(--sidebar-width) + (100vw - var(--sidebar-width)) / 2);
            max-width: min(520px, calc(100vw - 32px));
            padding: 10px 14px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -8px);
            transition: opacity .18s ease, transform .18s ease;
        }

        .toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast.error {
            color: var(--danger);
        }

        .sidebar-backdrop {
            display: none;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 760px) {
            .mobile-only {
                display: inline-grid;
            }

            .sidebar {
                position: fixed;
                z-index: 40;
                top: 0;
                left: 0;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: 10px 0 35px rgba(0, 0, 0, .18);
            }

            .sidebar-backdrop {
                position: fixed;
                z-index: 35;
                inset: 0;
                background: rgba(0, 0, 0, .35);
            }

            .sidebar-backdrop.visible {
                display: block;
            }

            .toast {
                left: 50%;
            }

            .topbar {
                padding: 7px 9px;
            }

            .topbar-title {
                text-align: left;
            }

            .topbar-actions .text-button {
                padding: 7px 8px;
            }

            .welcome-view {
                align-items: flex-start;
                padding: 34px 14px 60px;
            }

            .new-project-form {
                padding: 16px;
                border-radius: 14px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .submit-row {
                align-items: stretch;
                flex-direction: column;
            }

            .thread-view {
                padding: 10px 16px 145px;
            }

            .message {
                grid-template-columns: 26px minmax(0, 1fr);
                gap: 10px;
            }

            .assistant-avatar {
                width: 26px;
                height: 26px;
            }

            .message-content {
                font-size: 15px;
            }

            .message-tools {
                opacity: 1;
            }

            .version-history {
                margin-left: 36px;
            }

            .composer-area {
                padding: 0 10px 10px;
            }

            .composer {
                border-radius: 21px;
            }

            .compact-input {
                width: 68px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="小说项目">
            <div class="brand-row">
                <div class="brand-mark" aria-hidden="true">文</div>
                <div class="brand-name">长篇小说助手</div>
                <button class="icon-button mobile-only" type="button" onclick="closeSidebar()" aria-label="关闭侧栏">
                    ✕
                </button>
            </div>

            <button class="sidebar-action" type="button" onclick="newProject()">
                <span aria-hidden="true">＋</span>
                <span>新建小说</span>
            </button>

            <div class="sidebar-section-title">最近项目 <span id="project-count"></span></div>
            <nav class="project-list" id="project-list"></nav>

            <div class="sidebar-footer">
                <button class="sidebar-action" type="button" onclick="toggleTheme()">
                    <span id="theme-icon" aria-hidden="true">◐</span>
                    <span id="theme-label">切换深色模式</span>
                </button>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

        <section class="workspace">
            <header class="topbar">
                <button class="icon-button mobile-only" type="button" onclick="openSidebar()" aria-label="打开侧栏">
                    ☰
                </button>
                <h1 class="topbar-title" id="topbar-title">长篇小说写作助手</h1>
                <div class="topbar-actions">
                    <button class="text-button" id="export-btn" type="button" onclick="exportProject()" hidden>导出</button>
                    <button class="text-button danger" id="delete-btn" type="button" onclick="deleteProject()" hidden>删除</button>
                </div>
            </header>

            <div class="toast" id="toast" role="status" aria-live="polite"></div>

            <main class="conversation" id="conversation">
                <section class="welcome-view" id="welcome-view">
                    <div class="welcome-card">
                        <div class="welcome-heading">
                            <div class="welcome-icon" aria-hidden="true">文</div>
                            <h1>从现有故事继续创作</h1>
                            <p>导入小说正文，系统会维护人物、世界观、时间线和伏笔记忆。</p>
                        </div>

                        <form class="new-project-form" id="new-project-form">
                            <div class="field">
                                <label class="field-label" for="new-title">小说名称</label>
                                <input class="control" id="new-title" name="title" maxlength="80"
                                       placeholder="未填写时自动使用原文首行">
                            </div>

                            <div class="field">
                                <label class="field-label" for="new-text">小说原文</label>
                                <textarea class="control" id="new-text" name="text_input"
                                          placeholder="粘贴已有小说内容，或在下方选择 TXT / Markdown 文件"></textarea>
                            </div>

                            <div class="file-row">
                                <input class="file-input" id="file-input" type="file" name="file" accept=".txt,.md">
                                <label class="file-label" for="file-input">上传文件</label>
                                <span class="file-name" id="file-name">支持 UTF-8、GB18030</span>
                            </div>

                            <details class="advanced-settings">
                                <summary>创作设置</summary>
                                <div class="field">
                                    <label class="field-label" for="new-requirements">长期写作要求</label>
                                    <textarea class="control" id="new-requirements" name="requirements"
                                              placeholder="例如：保持第三人称限知视角；减少华丽比喻；推进调查主线。"></textarea>
                                </div>
                                <div class="settings-grid">
                                    <div class="field">
                                        <label class="field-label" for="new-word-limit">目标字数</label>
                                        <input class="control" id="new-word-limit" name="word_limit"
                                               type="number" value="1000" min="100" max="10000">
                                    </div>
                                    <div class="field">
                                        <label class="field-label" for="new-writing-mode">写作模式</label>
                                        <select class="control" id="new-writing-mode" name="writing_mode">
                                            <option value="standard">标准：规划并检查</option>
                                            <option value="quick">快速：直接续写</option>
                                        </select>
                                    </div>
                                </div>
                            </details>

                            <div class="submit-row">
                                <span class="submit-hint">
                                    超过 {{ "{:,}".format(text_length_threshold) }} 字符时自动建立分层长期记忆。
                                </span>
                                <button class="primary-button" id="start-btn" type="submit">
                                    开始续写
                                    <span aria-hidden="true">→</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </section>

                <section class="thread-view" id="thread-view" hidden>
                    <div id="thread"></div>
                    <details class="version-history" id="version-history" hidden>
                        <summary>版本历史</summary>
                        <div id="version-list"></div>
                    </details>
                </section>
            </main>

            <footer class="composer-area" id="composer-area" hidden>
                <div class="composer">
                    <label class="sr-only" for="instruction-input">本次续写要求</label>
                    <textarea id="instruction-input" rows="1"
                              placeholder="输入本次续写要求；留空则沿用当前设定"></textarea>
                    <div class="composer-toolbar">
                        <div class="composer-options">
                            <select class="compact-select" id="composer-mode" aria-label="写作模式">
                                <option value="standard">标准模式</option>
                                <option value="quick">快速模式</option>
                            </select>
                            <label class="sr-only" for="composer-word-limit">目标字数</label>
                            <input class="compact-input" id="composer-word-limit" type="number"
                                   value="1000" min="100" max="10000" aria-label="目标字数">
                            <button class="tool-button" id="regenerate-btn" type="button" onclick="restartWriting()">
                                重新生成
                            </button>
                        </div>
                        <button class="send-button" id="continue-btn" type="button"
                                onclick="continueWriting()" aria-label="继续续写">
                            ↑
                        </button>
                    </div>
                </div>
                <div class="composer-note">Ctrl / ⌘ + Enter 发送 · 生成内容请结合原文人工审阅</div>
            </footer>
        </section>
    </div>

    <script>
        let currentProjectId = null;
        let currentProject = null;
        let eventSource = null;
        let liveMessage = null;
        let streamCompleted = false;
        let busy = false;
        let toastTimer = null;

        const $ = id => document.getElementById(id);

        function icon(name) {
            const icons = {
                copy: "⧉",
                regenerate: "↻"
            };
            return icons[name] || "";
        }

        function setBusy(value) {
            busy = value;
            ["start-btn", "continue-btn", "regenerate-btn", "delete-btn"].forEach(id => {
                const element = $(id);
                if (element) element.disabled = value;
            });
            if (value) {
                $("continue-btn").textContent = "■";
                $("continue-btn").setAttribute("aria-label", "正在生成");
            } else {
                $("continue-btn").textContent = "↑";
                $("continue-btn").setAttribute("aria-label", "继续续写");
            }
        }

        function showToast(message, error = false, persistent = false) {
            const toast = $("toast");
            toast.textContent = message;
            toast.className = `toast visible${error ? " error" : ""}`;
            clearTimeout(toastTimer);
            if (!persistent) {
                toastTimer = setTimeout(hideToast, 3800);
            }
        }

        function hideToast() {
            $("toast").className = "toast";
        }

        function openSidebar() {
            $("sidebar").classList.add("open");
            $("sidebar-backdrop").classList.add("visible");
        }

        function closeSidebar() {
            $("sidebar").classList.remove("open");
            $("sidebar-backdrop").classList.remove("visible");
        }

        function applyTheme(theme) {
            const resolved = theme === "dark" ? "dark" : "light";
            document.documentElement.dataset.theme = resolved;
            $("theme-label").textContent = resolved === "dark" ? "切换浅色模式" : "切换深色模式";
            $("theme-icon").textContent = resolved === "dark" ? "☀" : "◐";
        }

        function toggleTheme() {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            localStorage.setItem("novel-theme", next);
            applyTheme(next);
        }

        function initializeTheme() {
            const saved = localStorage.getItem("novel-theme");
            const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            applyTheme(saved || preferred);
        }

        function closeStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        }

        async function api(url, options = {}) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
                throw new Error(body.error || `请求失败（${response.status}）`);
            }
            return body;
        }

        function formatDate(value) {
            const date = new Date(value);
            const today = new Date();
            if (date.toDateString() === today.toDateString()) {
                return date.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
            }
            return date.toLocaleDateString([], {month: "short", day: "numeric"});
        }

        async function loadProjects() {
            const body = await api("/api/projects");
            $("project-count").textContent = body.projects.length ? `(${body.projects.length})` : "";
            const list = $("project-list");
            list.replaceChildren();

            if (!body.projects.length) {
                const empty = document.createElement("div");
                empty.className = "sidebar-section-title";
                empty.textContent = "暂无项目";
                list.appendChild(empty);
                return;
            }

            body.projects.forEach(project => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = `project-item${project.id === currentProjectId ? " active" : ""}`;
                button.title = `${project.title} · ${formatDate(project.updated_at)}`;
                button.textContent = project.title;
                button.onclick = () => loadProject(project.id);
                list.appendChild(button);
            });
        }

        async function loadProject(projectId) {
            closeStream();
            const body = await api(`/api/projects/${projectId}`);
            currentProjectId = projectId;
            currentProject = body.project;
            $("topbar-title").textContent = body.project.title;
            $("welcome-view").hidden = true;
            $("thread-view").hidden = false;
            $("composer-area").hidden = false;
            $("export-btn").hidden = false;
            $("delete-btn").hidden = false;
            $("instruction-input").value = body.project.requirements || "";
            $("composer-word-limit").value = body.project.word_limit;
            $("composer-mode").value = body.project.writing_mode;
            renderProject(body.project);
            hideToast();
            closeSidebar();
            await loadProjects();
        }

        function renderProject(project) {
            const thread = $("thread");
            thread.replaceChildren();

            if (!project.active_generations.length) {
                const empty = document.createElement("div");
                empty.className = "thread-empty";
                empty.textContent = "项目已创建，正在等待第一次续写。";
                thread.appendChild(empty);
            }

            project.active_generations.forEach((generation, index) => {
                thread.appendChild(messageElement(
                    generation,
                    index === project.active_generations.length - 1
                ));
            });

            const history = project.generation_history;
            $("version-history").hidden = history.length === 0;
            const versionList = $("version-list");
            versionList.replaceChildren();

            history.forEach(version => {
                const row = document.createElement("div");
                row.className = "version-row";

                const label = document.createElement("strong");
                label.textContent = `第 ${version.position} 段 · v${version.version}`;

                const excerpt = document.createElement("span");
                excerpt.className = "version-excerpt";
                excerpt.textContent = version.content.replace(/\s+/g, " ").slice(0, 100);

                const restore = document.createElement("button");
                restore.type = "button";
                restore.className = "tool-button";
                restore.textContent = version.is_active ? "当前版本" : "恢复";
                restore.disabled = Boolean(version.is_active);
                restore.onclick = () => restoreVersion(version.id);

                row.append(label, excerpt, restore);
                versionList.appendChild(row);
            });
        }

        function messageElement(generation, isLast = false) {
            const article = document.createElement("article");
            article.className = "message";

            const avatar = document.createElement("div");
            avatar.className = "assistant-avatar";
            avatar.textContent = "文";
            avatar.setAttribute("aria-hidden", "true");

            const main = document.createElement("div");
            main.className = "message-main";

            const meta = document.createElement("div");
            meta.className = "message-meta";
            const author = document.createElement("span");
            author.className = "message-author";
            author.textContent = `续写第 ${generation.position} 段`;
            const version = document.createElement("span");
            version.className = "version-badge";
            version.textContent = `版本 ${generation.version}`;
            meta.append(author, version);

            const content = document.createElement("div");
            content.className = "message-content";
            content.textContent = generation.content;

            const tools = document.createElement("div");
            tools.className = "message-tools";
            const copy = document.createElement("button");
            copy.type = "button";
            copy.className = "tool-button";
            copy.textContent = `${icon("copy")} 复制`;
            copy.onclick = () => copyText(generation.content, copy);
            tools.appendChild(copy);

            if (isLast) {
                const regenerate = document.createElement("button");
                regenerate.type = "button";
                regenerate.className = "tool-button";
                regenerate.textContent = `${icon("regenerate")} 重新生成`;
                regenerate.onclick = restartWriting;
                tools.appendChild(regenerate);
            }

            main.append(meta, content, tools);

            if (generation.plan) {
                main.appendChild(analysisDetails("写作计划", generation.plan));
            }
            if (generation.consistency_report) {
                main.appendChild(analysisDetails("一致性检查", generation.consistency_report));
            }

            article.append(avatar, main);
            return article;
        }

        function analysisDetails(title, body) {
            const details = document.createElement("details");
            details.className = "analysis-details";
            const summary = document.createElement("summary");
            summary.textContent = title;
            const content = document.createElement("div");
            content.className = "analysis-body";
            content.textContent = body;
            details.append(summary, content);
            return details;
        }

        async function copyText(text, button) {
            try {
                await navigator.clipboard.writeText(text);
                const previous = button.textContent;
                button.textContent = "已复制";
                setTimeout(() => { button.textContent = previous; }, 1400);
            } catch {
                showToast("复制失败，请手动选择正文", true);
            }
        }

        function newProject() {
            closeStream();
            setBusy(false);
            currentProjectId = null;
            currentProject = null;
            $("new-project-form").reset();
            $("new-word-limit").value = "1000";
            $("new-writing-mode").value = "standard";
            $("file-name").textContent = "支持 UTF-8、GB18030";
            $("topbar-title").textContent = "长篇小说写作助手";
            $("welcome-view").hidden = false;
            $("thread-view").hidden = true;
            $("composer-area").hidden = true;
            $("export-btn").hidden = true;
            $("delete-btn").hidden = true;
            hideToast();
            closeSidebar();
            loadProjects().catch(error => showToast(error.message, true));
            setTimeout(() => $("new-title").focus(), 0);
        }

        function settingsQuery() {
            return new URLSearchParams({
                word_limit: $("composer-word-limit").value,
                requirements: $("instruction-input").value,
                writing_mode: $("composer-mode").value
            }).toString();
        }

        function liveMessageElement(replaceLast) {
            const generation = {
                position: currentProject?.active_generations?.length
                    ? (replaceLast
                        ? currentProject.active_generations.at(-1).position
                        : currentProject.active_generations.at(-1).position + 1)
                    : 1,
                version: replaceLast
                    ? (currentProject?.active_generations?.at(-1)?.version || 1) + 1
                    : 1,
                content: ""
            };
            const article = messageElement(generation, false);
            const content = article.querySelector(".message-content");
            content.classList.add("typing-cursor");
            article.querySelector(".message-tools").remove();
            return {article, content};
        }

        function startStreaming(url, replaceLast = false) {
            if (busy) return;
            closeStream();
            setBusy(true);
            streamCompleted = false;
            showToast(replaceLast ? "正在生成新的版本…" : "正在准备续写…", false, true);

            const live = liveMessageElement(replaceLast);
            liveMessage = live.article;
            $("thread").querySelector(".thread-empty")?.remove();
            $("thread").appendChild(live.article);
            live.article.scrollIntoView({behavior: "smooth", block: "start"});

            eventSource = new EventSource(url);
            eventSource.onmessage = async event => {
                const data = JSON.parse(event.data);
                if (data.type === "status") {
                    showToast(data.content, false, true);
                } else if (data.type === "content") {
                    live.content.textContent += data.content;
                    $("conversation").scrollTop = $("conversation").scrollHeight;
                } else if (data.type === "review") {
                    live.article.querySelector(".message-main")
                        .appendChild(analysisDetails("一致性检查", data.content));
                } else if (data.type === "complete") {
                    streamCompleted = true;
                    closeStream();
                    setBusy(false);
                    hideToast();
                    await loadProject(currentProjectId);
                } else if (data.type === "error") {
                    closeStream();
                    setBusy(false);
                    live.article.remove();
                    showToast(data.content, true, true);
                }
            };

            eventSource.onerror = () => {
                if (streamCompleted) return;
                closeStream();
                setBusy(false);
                live.article.remove();
                showToast("连接中断。已保存的版本不会丢失，请重新打开项目确认。", true, true);
            };
        }

        $("new-project-form").addEventListener("submit", async event => {
            event.preventDefault();
            if (busy) return;
            setBusy(true);
            showToast("正在创建小说项目…", false, true);
            try {
                const body = await api("/process", {
                    method: "POST",
                    body: new FormData(event.currentTarget)
                });
                currentProjectId = body.project_id;
                setBusy(false);
                await loadProject(currentProjectId);
                startStreaming(`/stream/${currentProjectId}`);
            } catch (error) {
                setBusy(false);
                showToast(error.message, true, true);
            }
        });

        function continueWriting() {
            if (!currentProjectId || busy) return;
            startStreaming(`/continue/${currentProjectId}?${settingsQuery()}`);
        }

        function restartWriting() {
            if (!currentProjectId || busy) return;
            startStreaming(`/restart/${currentProjectId}?${settingsQuery()}`, true);
        }

        async function restoreVersion(generationId) {
            if (busy) return;
            try {
                showToast("正在恢复历史版本…", false, true);
                await api(`/api/projects/${currentProjectId}/restore/${generationId}`, {
                    method: "POST"
                });
                await loadProject(currentProjectId);
                showToast("历史版本已恢复");
            } catch (error) {
                showToast(error.message, true, true);
            }
        }

        async function deleteProject() {
            if (!currentProjectId || busy) return;
            if (!confirm(`确定删除“${currentProject.title}”及其全部版本吗？`)) return;
            try {
                await api(`/api/projects/${currentProjectId}`, {method: "DELETE"});
                newProject();
                showToast("项目已删除");
            } catch (error) {
                showToast(error.message, true, true);
            }
        }

        function exportProject() {
            if (!currentProject) return;
            const generated = currentProject.active_generations
                .map((item, index) => `## 续写 ${index + 1}\n\n${item.content}`)
                .join("\n\n");
            const content = `# ${currentProject.title}\n\n## 原文\n\n${currentProject.original_text}\n\n${generated}\n`;
            const blob = new Blob([content], {type: "text/markdown;charset=utf-8"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${currentProject.title.replace(/[\\/:*?"<>|]/g, "_")}.md`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function resizeComposer() {
            const input = $("instruction-input");
            input.style.height = "auto";
            input.style.height = `${Math.min(input.scrollHeight, 180)}px`;
        }

        $("instruction-input").addEventListener("input", resizeComposer);
        $("instruction-input").addEventListener("keydown", event => {
            if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
                event.preventDefault();
                continueWriting();
            }
        });

        $("file-input").addEventListener("change", event => {
            const file = event.target.files[0];
            $("file-name").textContent = file ? file.name : "支持 UTF-8、GB18030";
        });

        window.addEventListener("beforeunload", closeStream);
        initializeTheme();
        loadProjects().catch(error => showToast(error.message, true, true));
    </script>
</body>
</html>
