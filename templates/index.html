<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>长篇小说写作助手</title>
    <style>
        :root {
            --bg: #ffffff;
            --sidebar: #f9f9f9;
            --surface: #ffffff;
            --surface-secondary: #f7f7f8;
            --surface-hover: #ececec;
            --text: #0d0d0d;
            --text-secondary: #676767;
            --border: #e5e5e5;
            --button: #0d0d0d;
            --button-text: #ffffff;
            --danger: #c83232;
            --success: #16845b;
            --shadow: 0 0 0 1px rgba(0, 0, 0, .05), 0 4px 18px rgba(0, 0, 0, .08);
            --sidebar-width: 260px;
        }

        html[data-theme="dark"] {
            --bg: #212121;
            --sidebar: #171717;
            --surface: #2f2f2f;
            --surface-secondary: #2a2a2a;
            --surface-hover: #2f2f2f;
            --text: #ececec;
            --text-secondary: #b4b4b4;
            --border: #3d3d3d;
            --button: #ececec;
            --button-text: #171717;
            --danger: #ff8585;
            --success: #63d5aa;
            --shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 6px 22px rgba(0, 0, 0, .24);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            color: var(--text);
            background: var(--bg);
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            font-size: 14px;
        }

        button,
        input,
        textarea,
        select {
            color: inherit;
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible,
        summary:focus-visible {
            outline: 2px solid #5b9df9;
            outline-offset: 2px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .45;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            display: flex;
            flex: 0 0 var(--sidebar-width);
            flex-direction: column;
            width: var(--sidebar-width);
            height: 100%;
            padding: 10px;
            background: var(--sidebar);
            transition: transform .2s ease;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            padding: 6px 8px 12px;
        }

        .brand-mark,
        .assistant-avatar {
            display: grid;
            flex: 0 0 auto;
            place-items: center;
            width: 28px;
            height: 28px;
            color: var(--button-text);
            background: var(--button);
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
        }

        .brand-name {
            overflow: hidden;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-button {
            display: inline-grid;
            flex: 0 0 auto;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            color: var(--text);
            background: transparent;
            border-radius: 9px;
        }

        .icon-button:hover,
        .sidebar-action:hover,
        .project-item:hover {
            background: var(--surface-hover);
        }

        .mobile-only {
            display: none;
        }

        .sidebar-action {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 42px;
            padding: 9px 10px;
            color: var(--text);
            background: transparent;
            border-radius: 9px;
            text-align: left;
        }

        .sidebar-section-title {
            padding: 22px 10px 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
        }

        .project-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .project-item {
            display: block;
            width: 100%;
            margin-bottom: 2px;
            padding: 10px;
            overflow: hidden;
            color: var(--text);
            background: transparent;
            border-radius: 9px;
            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .project-item.active {
            background: var(--surface-hover);
            font-weight: 600;
        }

        .sidebar-footer {
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .workspace {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-width: 0;
            height: 100%;
            background: var(--bg);
        }

        .topbar {
            display: flex;
            z-index: 10;
            align-items: center;
            justify-content: space-between;
            min-height: 56px;
            padding: 8px 16px;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            border-bottom: 1px solid transparent;
            backdrop-filter: blur(12px);
        }

        .topbar-title {
            flex: 1;
            min-width: 0;
            margin: 0 10px;
            overflow: hidden;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .text-button {
            min-height: 36px;
            padding: 7px 12px;
            color: var(--text);
            background: transparent;
            border-radius: 9px;
            font-size: 13px;
        }

        .text-button:hover {
            background: var(--surface-hover);
        }

        .text-button.danger {
            color: var(--danger);
        }

        .conversation {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .welcome-view {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            padding: 48px 24px 80px;
        }

        .welcome-card {
            width: min(720px, 100%);
        }

        .welcome-heading {
            margin-bottom: 28px;
            text-align: center;
        }

        .welcome-icon {
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            margin: 0 auto 18px;
            color: var(--button-text);
            background: var(--button);
            border-radius: 50%;
            font-size: 20px;
        }

        .welcome-heading h1 {
            margin: 0 0 10px;
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 600;
            letter-spacing: -.03em;
        }

        .welcome-heading p {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.65;
        }

        .new-project-form {
            padding: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }

        .field {
            margin-bottom: 16px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field-label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .control {
            width: 100%;
            padding: 11px 12px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        textarea.control {
            min-height: 180px;
            line-height: 1.65;
            resize: vertical;
        }

        .control:focus {
            border-color: #8b8b8b;
            outline: none;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        .file-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 36px;
            padding: 7px 11px;
            color: var(--text);
            background: var(--surface-secondary);
            border-radius: 9px;
            cursor: pointer;
        }

        .file-label:hover {
            background: var(--surface-hover);
        }

        .file-name {
            flex: 1;
            overflow: hidden;
            color: var(--text-secondary);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .advanced-settings {
            margin-top: 4px;
            border-top: 1px solid var(--border);
        }

        .advanced-settings summary {
            padding: 14px 0 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-top: 10px;
        }

        .primary-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            padding: 9px 16px;
            color: var(--button-text);
            background: var(--button);
            border-radius: 10px;
            font-weight: 600;
        }

        .primary-button:hover {
            opacity: .88;
        }

        .submit-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 18px;
        }

        .submit-hint {
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.5;
        }

        .thread-view {
            width: min(1120px, 100%);
            margin: 0 auto;
            padding: 22px 24px 160px;
        }

        .thread-empty {
            padding: 100px 20px;
            color: var(--text-secondary);
            text-align: center;
        }

        .chapter-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding: 8px;
            background: var(--surface-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .chapter-select {
            min-width: 0;
            flex: 1;
            height: 38px;
            padding: 0 10px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 9px;
        }

        .workbench-layout {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            align-items: start;
            gap: 16px;
        }

        .chapter-browser {
            position: sticky;
            top: 12px;
            overflow: hidden;
            background: var(--surface-secondary);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .chapter-browser-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 12px 12px 9px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 600;
        }

        .chapter-list {
            max-height: calc(100vh - 300px);
            padding: 6px;
            overflow-y: auto;
        }

        .chapter-nav-item {
            display: block;
            width: 100%;
            padding: 9px 10px;
            color: var(--text-secondary);
            background: transparent;
            border-radius: 9px;
            text-align: left;
        }

        .chapter-nav-item:hover,
        .chapter-nav-item.active {
            color: var(--text);
            background: var(--surface-hover);
        }

        .chapter-nav-title {
            display: block;
            overflow: hidden;
            font-size: 13px;
            font-weight: 550;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chapter-nav-meta {
            display: block;
            margin-top: 3px;
            color: var(--text-secondary);
            font-size: 11px;
        }

        .editor-column {
            min-width: 0;
        }

        .chapter-editor {
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .03);
        }

        .chapter-editor-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--border);
        }

        .chapter-title-input {
            min-width: 0;
            flex: 1;
            padding: 4px 0;
            color: var(--text);
            background: transparent;
            border: 0;
            font-size: 18px;
            font-weight: 650;
        }

        .chapter-title-input:focus {
            outline: 0;
        }

        .chapter-meta {
            flex: 0 0 auto;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .chapter-content-input {
            display: block;
            width: 100%;
            min-height: 48vh;
            padding: 24px 26px;
            color: var(--text);
            background: transparent;
            border: 0;
            font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
            font-size: 16px;
            line-height: 1.95;
            resize: vertical;
        }

        .chapter-content-input:focus {
            outline: 0;
        }

        .chapter-content-input.generating {
            background: var(--surface-secondary);
        }

        .chapter-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            border-top: 1px solid var(--border);
        }

        .chapter-action-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chapter-analysis {
            padding: 0 18px 14px;
        }

        .message {
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr);
            gap: 14px;
            padding: 22px 0 28px;
        }

        .assistant-avatar {
            width: 30px;
            height: 30px;
            font-size: 12px;
        }

        .message-main {
            min-width: 0;
        }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 30px;
            margin-bottom: 8px;
        }

        .message-author {
            font-weight: 600;
        }

        .version-badge {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 400;
        }

        .message-content {
            color: var(--text);
            font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
            font-size: 16px;
            line-height: 1.95;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message-tools {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
            opacity: 0;
            transition: opacity .15s ease;
        }

        .message:hover .message-tools,
        .message:focus-within .message-tools {
            opacity: 1;
        }

        .tool-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 32px;
            padding: 6px 9px;
            color: var(--text-secondary);
            background: transparent;
            border-radius: 8px;
            font-size: 12px;
        }

        .tool-button:hover {
            color: var(--text);
            background: var(--surface-hover);
        }

        .analysis-details {
            margin-top: 14px;
            color: var(--text-secondary);
            background: var(--surface-secondary);
            border-radius: 10px;
            font-size: 13px;
        }

        .analysis-details summary {
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .analysis-body {
            padding: 0 12px 12px;
            line-height: 1.65;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .typing-cursor::after {
            display: inline-block;
            width: 7px;
            height: 17px;
            margin-left: 3px;
            vertical-align: -2px;
            background: var(--text);
            animation: blink .8s steps(1) infinite;
            content: "";
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .version-history {
            margin: 18px 0 30px;
            border-top: 1px solid var(--border);
        }

        .version-history > summary {
            padding: 16px 0;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .version-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            font-size: 12px;
        }

        .version-excerpt {
            overflow: hidden;
            color: var(--text-secondary);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .composer-area {
            z-index: 8;
            flex: 0 0 auto;
            padding: 0 24px 14px;
            background: linear-gradient(to top, var(--bg) 74%, transparent);
        }

        .composer {
            width: min(780px, 100%);
            margin: 0 auto;
            padding: 10px 12px 9px;
            background: var(--surface);
            border-radius: 26px;
            box-shadow: var(--shadow);
        }

        .composer textarea {
            display: block;
            width: 100%;
            min-height: 46px;
            max-height: 180px;
            padding: 9px 9px 5px;
            color: var(--text);
            background: transparent;
            border: 0;
            line-height: 1.5;
            resize: none;
        }

        .composer textarea:focus {
            outline: 0;
        }

        .composer-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .composer-options {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
        }

        .compact-select,
        .compact-input {
            height: 34px;
            padding: 5px 8px;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 12px;
        }

        .compact-input {
            width: 78px;
        }

        .send-button {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            min-width: 112px;
            height: 34px;
            padding: 0 14px;
            color: var(--button-text);
            background: var(--button);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .composer-note {
            margin: 7px auto 0;
            color: var(--text-secondary);
            font-size: 11px;
            text-align: center;
        }

        .toast {
            position: fixed;
            z-index: 50;
            top: 68px;
            left: calc(var(--sidebar-width) + (100vw - var(--sidebar-width)) / 2);
            max-width: min(520px, calc(100vw - 32px));
            padding: 10px 14px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -8px);
            transition: opacity .18s ease, transform .18s ease;
        }

        .toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast.error {
            color: var(--danger);
        }

        .sidebar-backdrop {
            display: none;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 760px) {
            .mobile-only {
                display: inline-grid;
            }

            .sidebar {
                position: fixed;
                z-index: 40;
                top: 0;
                left: 0;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: 10px 0 35px rgba(0, 0, 0, .18);
            }

            .sidebar-backdrop {
                position: fixed;
                z-index: 35;
                inset: 0;
                background: rgba(0, 0, 0, .35);
            }

            .sidebar-backdrop.visible {
                display: block;
            }

            .toast {
                left: 50%;
            }

            .topbar {
                padding: 7px 9px;
            }

            .topbar-title {
                text-align: left;
            }

            .topbar-actions .text-button {
                padding: 7px 8px;
            }

            .welcome-view {
                align-items: flex-start;
                padding: 34px 14px 60px;
            }

            .new-project-form {
                padding: 16px;
                border-radius: 14px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .submit-row {
                align-items: stretch;
                flex-direction: column;
            }

            .thread-view {
                padding: 10px 16px 145px;
            }

            .chapter-toolbar {
                margin-top: 4px;
            }

            .workbench-layout {
                display: block;
            }

            .chapter-browser {
                display: none;
            }

            .chapter-editor-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .chapter-title-input {
                width: 100%;
            }

            .chapter-content-input {
                min-height: 54vh;
                padding: 18px;
                font-size: 15px;
            }

            .chapter-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .chapter-action-group {
                justify-content: space-between;
            }

            .message {
                grid-template-columns: 26px minmax(0, 1fr);
                gap: 10px;
            }

            .assistant-avatar {
                width: 26px;
                height: 26px;
            }

            .message-content {
                font-size: 15px;
            }

            .message-tools {
                opacity: 1;
            }

            .composer-area {
                padding: 0 10px 10px;
            }

            .composer {
                border-radius: 21px;
            }

            .compact-input {
                width: 68px;
            }
        }

        @media (max-width: 420px) {
            .composer-toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .composer-options {
                justify-content: space-between;
            }

            .send-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="小说项目">
            <div class="brand-row">
                <div class="brand-mark" aria-hidden="true">文</div>
                <div class="brand-name">长篇小说助手</div>
                <button class="icon-button mobile-only" type="button" onclick="closeSidebar()" aria-label="关闭侧栏">
                    ✕
                </button>
            </div>

            <button class="sidebar-action" type="button" onclick="newProject()">
                <span aria-hidden="true">＋</span>
                <span>新建小说</span>
            </button>

            <div class="sidebar-section-title">最近项目 <span id="project-count"></span></div>
            <nav class="project-list" id="project-list"></nav>

            <div class="sidebar-footer">
                <button class="sidebar-action" type="button" onclick="toggleTheme()">
                    <span id="theme-icon" aria-hidden="true">◐</span>
                    <span id="theme-label">切换深色模式</span>
                </button>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

        <section class="workspace">
            <header class="topbar">
                <button class="icon-button mobile-only" type="button" onclick="openSidebar()" aria-label="打开侧栏">
                    ☰
                </button>
                <h1 class="topbar-title" id="topbar-title">长篇小说写作助手</h1>
                <div class="topbar-actions">
                    <button class="text-button" id="export-btn" type="button" onclick="exportProject()" hidden>导出</button>
                    <button class="text-button danger" id="delete-btn" type="button" onclick="deleteProject()" hidden>删除</button>
                </div>
            </header>

            <div class="toast" id="toast" role="status" aria-live="polite"></div>

            <main class="conversation" id="conversation">
                <section class="welcome-view" id="welcome-view">
                    <div class="welcome-card">
                        <div class="welcome-heading">
                            <div class="welcome-icon" aria-hidden="true">文</div>
                            <h1>从现有故事继续创作</h1>
                            <p>导入小说正文，系统会维护人物、世界观、时间线和伏笔记忆。</p>
                        </div>

                        <form class="new-project-form" id="new-project-form">
                            <div class="field">
                                <label class="field-label" for="new-title">小说名称</label>
                                <input class="control" id="new-title" name="title" maxlength="80"
                                       placeholder="未填写时自动使用原文首行">
                            </div>

                            <div class="field">
                                <label class="field-label" for="new-text">小说原文</label>
                                <textarea class="control" id="new-text" name="text_input"
                                          placeholder="粘贴已有小说内容，或在下方选择 TXT / Markdown 文件"></textarea>
                            </div>

                            <div class="file-row">
                                <input class="file-input" id="file-input" type="file" name="file" accept=".txt,.md">
                                <label class="file-label" for="file-input">上传文件</label>
                                <span class="file-name" id="file-name">支持 UTF-8、GB18030</span>
                            </div>

                            <details class="advanced-settings">
                                <summary>创作设置</summary>
                                <div class="field">
                                    <label class="field-label" for="new-requirements">长期写作要求</label>
                                    <textarea class="control" id="new-requirements" name="requirements"
                                              placeholder="例如：保持第三人称限知视角；减少华丽比喻；推进调查主线。"></textarea>
                                </div>
                                <div class="settings-grid">
                                    <div class="field">
                                        <label class="field-label" for="new-word-limit">目标字数</label>
                                        <input class="control" id="new-word-limit" name="word_limit"
                                               type="number" value="1000" min="100" max="10000">
                                    </div>
                                    <div class="field">
                                        <label class="field-label" for="new-writing-mode">写作模式</label>
                                        <select class="control" id="new-writing-mode" name="writing_mode">
                                            <option value="standard">标准：规划并检查</option>
                                            <option value="quick">快速：直接续写</option>
                                        </select>
                                    </div>
                                </div>
                            </details>

                            <div class="submit-row">
                                <span class="submit-hint">
                                    自动识别章节标题；超过 {{ "{:,}".format(text_length_threshold) }} 字符时建立长期记忆。
                                </span>
                                <button class="primary-button" id="start-btn" type="submit">
                                    开始续写
                                    <span aria-hidden="true">→</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </section>

                <section class="thread-view" id="thread-view" hidden>
                    <div class="chapter-toolbar">
                        <label class="sr-only" for="chapter-select">当前章节</label>
                        <select class="chapter-select" id="chapter-select"
                                onchange="selectChapter(this.value)"></select>
                        <button class="tool-button" id="new-chapter-btn" type="button"
                                onclick="createChapter()">＋ 新建章节</button>
                    </div>

                    <div class="workbench-layout">
                        <aside class="chapter-browser" aria-label="章节目录">
                            <div class="chapter-browser-head">
                                <span>章节目录</span>
                                <span id="chapter-count"></span>
                            </div>
                            <nav class="chapter-list" id="chapter-list"></nav>
                        </aside>

                        <div class="editor-column">
                            <article class="chapter-editor" id="chapter-editor">
                                <div class="chapter-editor-head">
                                    <input class="chapter-title-input" id="chapter-title"
                                           maxlength="120" aria-label="章节标题">
                                    <span class="chapter-meta" id="chapter-meta"></span>
                                </div>
                                <textarea class="chapter-content-input" id="chapter-content"
                                          aria-label="章节正文"
                                          placeholder="在这里编辑章节正文，保存时会自动创建新版本。"></textarea>
                                <div class="chapter-actions">
                                    <div class="chapter-action-group">
                                        <button class="tool-button" id="copy-chapter-btn" type="button"
                                                onclick="copyCurrentChapter()">⧉ 复制</button>
                                        <button class="tool-button danger" id="delete-chapter-btn" type="button"
                                                onclick="deleteCurrentChapter()">删除章节</button>
                                    </div>
                                    <div class="chapter-action-group">
                                        <button class="tool-button" id="generate-chapter-btn" type="button"
                                                onclick="restartWriting()">按要求 AI 重写本章</button>
                                        <button class="primary-button" id="save-chapter-btn" type="button"
                                                onclick="saveCurrentChapter()">保存新版本</button>
                                    </div>
                                </div>
                                <div class="chapter-analysis" id="chapter-analysis"></div>
                            </article>
                            <details class="version-history" id="version-history" hidden>
                                <summary>本章版本历史</summary>
                                <div id="version-list"></div>
                            </details>
                        </div>
                    </div>
                </section>
            </main>

            <footer class="composer-area" id="composer-area" hidden>
                <div class="composer">
                    <label class="sr-only" for="instruction-input">本次写作要求</label>
                    <textarea id="instruction-input" rows="1"
                              placeholder="输入写作要求；点击右侧按钮将续写下一章"></textarea>
                    <div class="composer-toolbar">
                        <div class="composer-options">
                            <select class="compact-select" id="composer-mode" aria-label="写作模式">
                                <option value="standard">标准模式</option>
                                <option value="quick">快速模式</option>
                            </select>
                            <label class="sr-only" for="composer-word-limit">目标字数</label>
                            <input class="compact-input" id="composer-word-limit" type="number"
                                   value="1000" min="100" max="10000" aria-label="目标字数">
                        </div>
                        <button class="send-button" id="continue-btn" type="button"
                                onclick="continueWriting()" aria-label="续写下一章">
                            续写下一章 →
                        </button>
                    </div>
                </div>
                <div class="composer-note">
                    底部按钮始终追加下一章；重写当前章节请使用正文下方的“按要求 AI 重写本章”
                    · Ctrl / ⌘ + Enter 续写下一章
                </div>
            </footer>
        </section>
    </div>

    <script>
        let currentProjectId = null;
        let currentProject = null;
        let currentChapterId = null;
        let editorBaseline = "";
        let eventSource = null;
        let streamSequence = 0;
        let streamCompleted = false;
        let busy = false;
        let toastTimer = null;

        const $ = id => document.getElementById(id);

        function setBusy(value) {
            busy = value;
            [
                "start-btn", "continue-btn", "delete-btn",
                "new-chapter-btn", "save-chapter-btn", "generate-chapter-btn",
                "delete-chapter-btn"
            ].forEach(id => {
                const element = $(id);
                if (element) element.disabled = value;
            });
            ["chapter-select", "chapter-title", "chapter-content"].forEach(id => {
                const element = $(id);
                if (element) element.disabled = value;
            });
            if (value) {
                $("continue-btn").textContent = "生成中…";
                $("continue-btn").setAttribute("aria-label", "正在生成");
            } else {
                $("continue-btn").textContent = "续写下一章 →";
                $("continue-btn").setAttribute("aria-label", "续写下一章");
            }
        }

        function showToast(message, error = false, persistent = false) {
            const toast = $("toast");
            toast.textContent = message;
            toast.className = `toast visible${error ? " error" : ""}`;
            clearTimeout(toastTimer);
            if (!persistent) {
                toastTimer = setTimeout(hideToast, 3800);
            }
        }

        function hideToast() {
            $("toast").className = "toast";
        }

        function openSidebar() {
            $("sidebar").classList.add("open");
            $("sidebar-backdrop").classList.add("visible");
        }

        function closeSidebar() {
            $("sidebar").classList.remove("open");
            $("sidebar-backdrop").classList.remove("visible");
        }

        function applyTheme(theme) {
            const resolved = theme === "dark" ? "dark" : "light";
            document.documentElement.dataset.theme = resolved;
            $("theme-label").textContent = resolved === "dark" ? "切换浅色模式" : "切换深色模式";
            $("theme-icon").textContent = resolved === "dark" ? "☀" : "◐";
        }

        function toggleTheme() {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            localStorage.setItem("novel-theme", next);
            applyTheme(next);
        }

        function initializeTheme() {
            const saved = localStorage.getItem("novel-theme");
            const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            applyTheme(saved || preferred);
        }

        function closeStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        }

        function cancelActiveStream() {
            streamSequence += 1;
            closeStream();
            streamCompleted = false;
            setBusy(false);
            $("chapter-content")?.classList.remove("generating");
        }

        async function api(url, options = {}) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
                throw new Error(body.error || `请求失败（${response.status}）`);
            }
            return body;
        }

        function formatDate(value) {
            const date = new Date(value);
            const today = new Date();
            if (date.toDateString() === today.toDateString()) {
                return date.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
            }
            return date.toLocaleDateString([], {month: "short", day: "numeric"});
        }

        async function loadProjects() {
            const body = await api("/api/projects");
            $("project-count").textContent = body.projects.length ? `(${body.projects.length})` : "";
            const list = $("project-list");
            list.replaceChildren();

            if (!body.projects.length) {
                const empty = document.createElement("div");
                empty.className = "sidebar-section-title";
                empty.textContent = "暂无项目";
                list.appendChild(empty);
                return;
            }

            body.projects.forEach(project => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = `project-item${project.id === currentProjectId ? " active" : ""}`;
                button.title = `${project.title} · ${formatDate(project.updated_at)}`;
                button.textContent = project.title;
                button.onclick = () => loadProject(project.id);
                list.appendChild(button);
            });
        }

        function analysisDetails(title, body) {
            const details = document.createElement("details");
            details.className = "analysis-details";
            const summary = document.createElement("summary");
            summary.textContent = title;
            const content = document.createElement("div");
            content.className = "analysis-body";
            content.textContent = body;
            details.append(summary, content);
            return details;
        }

        async function copyText(text, button) {
            try {
                await navigator.clipboard.writeText(text);
                const previous = button.textContent;
                button.textContent = "已复制";
                setTimeout(() => { button.textContent = previous; }, 1400);
            } catch {
                showToast("复制失败，请手动选择正文", true);
            }
        }

        function newProject() {
            if (busy && !confirm("当前章节仍在生成，确定停止并新建小说吗？")) {
                return;
            }
            cancelActiveStream();
            currentProjectId = null;
            currentProject = null;
            currentChapterId = null;
            editorBaseline = "";
            $("new-project-form").reset();
            $("new-word-limit").value = "1000";
            $("new-writing-mode").value = "standard";
            $("file-name").textContent = "支持 UTF-8、GB18030";
            $("topbar-title").textContent = "长篇小说写作助手";
            $("welcome-view").hidden = false;
            $("thread-view").hidden = true;
            $("composer-area").hidden = true;
            $("export-btn").hidden = true;
            $("delete-btn").hidden = true;
            hideToast();
            closeSidebar();
            loadProjects().catch(error => showToast(error.message, true));
            setTimeout(() => $("new-title").focus(), 0);
        }

        function settingsQuery() {
            return new URLSearchParams({
                word_limit: $("composer-word-limit").value,
                requirements: $("instruction-input").value,
                writing_mode: $("composer-mode").value
            }).toString();
        }

        $("new-project-form").addEventListener("submit", async event => {
            event.preventDefault();
            if (busy) return;
            setBusy(true);
            showToast("正在创建小说项目…", false, true);
            try {
                const body = await api("/process", {
                    method: "POST",
                    body: new FormData(event.currentTarget)
                });
                currentProjectId = body.project_id;
                setBusy(false);
                await loadProject(currentProjectId);
                startStreaming(`/stream/${currentProjectId}`);
            } catch (error) {
                setBusy(false);
                showToast(error.message, true, true);
            }
        });

        async function deleteProject() {
            if (!currentProjectId || busy) return;
            if (!confirm(`确定删除“${currentProject.title}”及其全部版本吗？`)) return;
            try {
                await api(`/api/projects/${currentProjectId}`, {method: "DELETE"});
                newProject();
                showToast("项目已删除");
            } catch (error) {
                showToast(error.message, true, true);
            }
        }

        function editorFingerprint() {
            return JSON.stringify({
                title: $("chapter-title").value,
                content: $("chapter-content").value
            });
        }

        function editorIsDirty() {
            return Boolean(currentChapterId) && editorFingerprint() !== editorBaseline;
        }

        async function loadProject(projectId, preferredChapterId = currentChapterId) {
            if (busy && !confirm("当前章节仍在生成，确定停止并切换项目吗？")) {
                return;
            }
            cancelActiveStream();
            const body = await api(`/api/projects/${projectId}`);
            currentProjectId = projectId;
            currentProject = body.project;
            $("topbar-title").textContent = body.project.title;
            $("welcome-view").hidden = true;
            $("thread-view").hidden = false;
            $("composer-area").hidden = false;
            $("export-btn").hidden = false;
            $("delete-btn").hidden = false;
            $("instruction-input").value = body.project.requirements || "";
            $("composer-word-limit").value = body.project.word_limit;
            $("composer-mode").value = body.project.writing_mode;
            renderProject(body.project, preferredChapterId);
            hideToast();
            closeSidebar();
            await loadProjects();
        }

        function renderProject(project, preferredChapterId = null) {
            const select = $("chapter-select");
            select.replaceChildren();
            const chapterList = $("chapter-list");
            chapterList.replaceChildren();
            $("chapter-count").textContent = `${project.chapters.length} 章`;
            project.chapters.forEach(chapter => {
                const option = document.createElement("option");
                option.value = chapter.id;
                option.textContent = `${chapter.position}. ${chapter.title}`;
                select.appendChild(option);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "chapter-nav-item";
                button.dataset.chapterId = chapter.id;
                button.onclick = () => selectChapter(chapter.id);

                const title = document.createElement("span");
                title.className = "chapter-nav-title";
                title.textContent = chapter.title;

                const meta = document.createElement("span");
                meta.className = "chapter-nav-meta";
                const contentLength = chapter.active_version?.content?.length || 0;
                meta.textContent =
                    `${chapter.kind === "source" ? "原文" : "续写"} · ${contentLength.toLocaleString()} 字`;

                button.append(title, meta);
                chapterList.appendChild(button);
            });

            const preferred = project.chapters.find(
                chapter => chapter.id === preferredChapterId
            );
            const selected = preferred || project.chapters.at(-1);
            currentChapterId = selected?.id || null;
            if (currentChapterId) select.value = currentChapterId;
            renderChapter(selected);
        }

        function renderChapter(chapter) {
            if (!chapter) {
                $("chapter-title").value = "";
                $("chapter-content").value = "";
                $("chapter-meta").textContent = "暂无章节";
                $("version-history").hidden = true;
                editorBaseline = editorFingerprint();
                return;
            }

            currentChapterId = chapter.id;
            $("chapter-select").value = chapter.id;
            document.querySelectorAll(".chapter-nav-item").forEach(item => {
                item.classList.toggle(
                    "active", item.dataset.chapterId === chapter.id
                );
            });
            const active = chapter.active_version || {};
            $("chapter-title").value = chapter.title;
            $("chapter-content").value = active.content || "";
            $("chapter-meta").textContent =
                `${chapter.kind === "source" ? "原文章节" : "续写章节"} · v${active.version || 1} · ${$("chapter-content").value.length.toLocaleString()} 字`;
            $("delete-chapter-btn").hidden = chapter.kind === "source";
            $("generate-chapter-btn").disabled = busy;

            const analysis = $("chapter-analysis");
            analysis.replaceChildren();
            if (active.plan) {
                analysis.appendChild(analysisDetails("写作计划", active.plan));
            }
            if (active.consistency_report) {
                analysis.appendChild(
                    analysisDetails("一致性检查", active.consistency_report)
                );
            }

            const versions = chapter.versions || [];
            $("version-history").hidden = versions.length < 2;
            const versionList = $("version-list");
            versionList.replaceChildren();
            versions.forEach(version => {
                const row = document.createElement("div");
                row.className = "version-row";

                const label = document.createElement("strong");
                const sourceLabel = version.source_type === "ai" ? "AI" :
                    (version.source_type === "import" ? "导入" : "编辑");
                label.textContent = `v${version.version} · ${sourceLabel}`;

                const excerpt = document.createElement("span");
                excerpt.className = "version-excerpt";
                excerpt.textContent =
                    (version.content || "").replace(/\s+/g, " ").slice(0, 100) || "空白章节";

                const restore = document.createElement("button");
                restore.type = "button";
                restore.className = "tool-button";
                restore.textContent = version.is_active ? "当前版本" : "恢复";
                restore.disabled = Boolean(version.is_active);
                restore.onclick = () => restoreVersion(version.id);

                row.append(label, excerpt, restore);
                versionList.appendChild(row);
            });
            editorBaseline = editorFingerprint();
        }

        function selectChapter(chapterId, force = false) {
            if (!force && editorIsDirty() &&
                !confirm("当前章节有未保存的修改，确定放弃吗？")) {
                $("chapter-select").value = currentChapterId;
                return;
            }
            const chapter = currentProject?.chapters?.find(
                item => item.id === chapterId
            );
            renderChapter(chapter);
        }

        async function createChapter() {
            if (!currentProjectId || busy) return;
            if (editorIsDirty() && !confirm("当前修改尚未保存，仍要新建章节吗？")) {
                return;
            }
            try {
                const body = await api(
                    `/api/projects/${currentProjectId}/chapters`,
                    {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({
                            title: `第 ${currentProject.chapters.length + 1} 章`,
                            content: ""
                        })
                    }
                );
                await loadProject(currentProjectId, body.chapter.id);
                $("chapter-title").focus();
                showToast("新章节已创建");
            } catch (error) {
                showToast(error.message, true, true);
            }
        }

        async function saveCurrentChapter() {
            if (!currentProjectId || !currentChapterId || busy) return;
            if (!editorIsDirty()) {
                showToast("正文没有需要保存的修改");
                return;
            }
            setBusy(true);
            showToast("正在保存章节并同步长期记忆…", false, true);
            try {
                await api(
                    `/api/projects/${currentProjectId}/chapters/${currentChapterId}`,
                    {
                        method: "PUT",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({
                            title: $("chapter-title").value,
                            content: $("chapter-content").value
                        })
                    }
                );
                setBusy(false);
                await loadProject(currentProjectId, currentChapterId);
                showToast("章节已保存为新版本");
            } catch (error) {
                setBusy(false);
                showToast(error.message, true, true);
            }
        }

        async function deleteCurrentChapter() {
            if (!currentProjectId || !currentChapterId || busy) return;
            const chapter = currentProject.chapters.find(
                item => item.id === currentChapterId
            );
            if (!chapter || chapter.kind === "source") return;
            if (!confirm(`确定删除《${chapter.title}》及其全部版本吗？`)) return;
            try {
                await api(
                    `/api/projects/${currentProjectId}/chapters/${currentChapterId}`,
                    {method: "DELETE"}
                );
                currentChapterId = null;
                await loadProject(currentProjectId, null);
                showToast("章节已删除，长期记忆已重新同步");
            } catch (error) {
                showToast(error.message, true, true);
            }
        }

        async function copyCurrentChapter() {
            await copyText($("chapter-content").value, $("copy-chapter-btn"));
        }

        function startStreaming(url, replaceCurrent = false) {
            if (busy) return;
            if (editorIsDirty() &&
                !confirm("当前章节有未保存的修改，继续生成将放弃这些修改，确定吗？")) {
                return;
            }
            closeStream();
            setBusy(true);
            streamCompleted = false;
            const streamId = ++streamSequence;
            const streamProjectId = currentProjectId;
            const previousChapterId = currentChapterId;
            showToast(
                replaceCurrent ? "正在生成当前章节的新版本…" : "正在准备下一章…",
                false,
                true
            );
            $("chapter-title").value = replaceCurrent
                ? $("chapter-title").value
                : "正在生成下一章…";
            $("chapter-content").value = "";
            $("chapter-content").classList.add("generating");
            $("chapter-meta").textContent = "AI 正在写作";
            $("chapter-analysis").replaceChildren();
            $("version-history").hidden = true;

            eventSource = new EventSource(url);
            eventSource.onmessage = async event => {
                if (
                    streamId !== streamSequence ||
                    streamProjectId !== currentProjectId
                ) return;
                const data = JSON.parse(event.data);
                if (data.type === "status") {
                    showToast(data.content, false, true);
                } else if (data.type === "content") {
                    $("chapter-content").value += data.content;
                    $("chapter-content").scrollTop = $("chapter-content").scrollHeight;
                } else if (data.type === "complete") {
                    streamCompleted = true;
                    closeStream();
                    setBusy(false);
                    $("chapter-content").classList.remove("generating");
                    await loadProject(
                        streamProjectId,
                        data.chapter_id || previousChapterId
                    );
                    showToast("章节生成完成");
                } else if (data.type === "error") {
                    closeStream();
                    setBusy(false);
                    $("chapter-content").classList.remove("generating");
                    await loadProject(streamProjectId, previousChapterId);
                    showToast(data.content, true, true);
                }
            };

            eventSource.onerror = async () => {
                if (
                    streamCompleted ||
                    streamId !== streamSequence ||
                    streamProjectId !== currentProjectId
                ) return;
                closeStream();
                setBusy(false);
                $("chapter-content").classList.remove("generating");
                await loadProject(streamProjectId, previousChapterId);
                showToast("连接中断，请重新打开章节确认保存状态。", true, true);
            };
        }

        function continueWriting() {
            if (!currentProjectId || busy) return;
            startStreaming(`/continue/${currentProjectId}?${settingsQuery()}`, false);
        }

        function restartWriting() {
            if (!currentProjectId || !currentChapterId || busy) return;
            const chapter = currentProject.chapters.find(
                item => item.id === currentChapterId
            );
            if (!chapter) return;
            startStreaming(
                `/api/projects/${currentProjectId}/chapters/${currentChapterId}/generate?${settingsQuery()}`,
                true
            );
        }

        async function restoreVersion(versionId) {
            if (busy) return;
            try {
                setBusy(true);
                showToast("正在恢复版本并重建长期记忆…", false, true);
                await api(
                    `/api/projects/${currentProjectId}/restore/${versionId}`,
                    {method: "POST"}
                );
                setBusy(false);
                await loadProject(currentProjectId, currentChapterId);
                showToast("版本和对应长期记忆已恢复");
            } catch (error) {
                setBusy(false);
                showToast(error.message, true, true);
            }
        }

        function exportProject() {
            if (!currentProject) return;
            const chapters = currentProject.chapters
                .map(chapter => {
                    const content = chapter.active_version?.content || "";
                    return `## ${chapter.title}\n\n${content}`;
                })
                .join("\n\n");
            const content = `# ${currentProject.title}\n\n${chapters}\n`;
            const blob = new Blob([content], {type: "text/markdown;charset=utf-8"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${currentProject.title.replace(/[\\/:*?"<>|]/g, "_")}.md`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function resizeComposer() {
            const input = $("instruction-input");
            input.style.height = "auto";
            input.style.height = `${Math.min(input.scrollHeight, 180)}px`;
        }

        $("instruction-input").addEventListener("input", resizeComposer);
        ["chapter-title", "chapter-content"].forEach(id => {
            $(id).addEventListener("input", () => {
                if (!currentChapterId || busy) return;
                const chapter = currentProject?.chapters?.find(
                    item => item.id === currentChapterId
                );
                const base = chapter?.active_version;
                $("chapter-meta").textContent = editorIsDirty()
                    ? `未保存 · ${$("chapter-content").value.length.toLocaleString()} 字`
                    : `${chapter?.kind === "source" ? "导入原稿" : "章节"} · v${base?.version || 1}`;
            });
        });
        $("instruction-input").addEventListener("keydown", event => {
            if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
                event.preventDefault();
                continueWriting();
            }
        });

        $("file-input").addEventListener("change", event => {
            const file = event.target.files[0];
            $("file-name").textContent = file ? file.name : "支持 UTF-8、GB18030";
        });

        window.addEventListener("beforeunload", event => {
            closeStream();
            if (editorIsDirty()) {
                event.preventDefault();
                event.returnValue = "";
            }
        });
        initializeTheme();
        loadProjects().catch(error => showToast(error.message, true, true));
    </script>
</body>
</html>
